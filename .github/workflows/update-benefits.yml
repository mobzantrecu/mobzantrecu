name: Update and Deploy

on:
  schedule:
    - cron: "15 6 * * *"
      timezone: "America/Argentina/Buenos_Aires"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Santander IPv4 por IP
        run: |
          node --input-type=module <<'EOF'
          import https from "node:https";
          import dns from "node:dns/promises";

          const hostname = "www.santander.com.ar";
          const path =
            "/bff-benefits/brands?categories=GAS&days=&exclusive=&pay_with=&location=caba&page=1&limit=12";

          const ips = await dns.resolve4(hostname);

          console.log("IPv4 encontrados:", ips);

          for (const ip of ips) {
            console.log(`\n=== Probando ${ip} ===`);

            try {
              const result = await new Promise((resolve, reject) => {
                const req = https.get(
                  {
                    hostname: ip,
                    path,
                    family: 4,

                    // Muy importante:
                    servername: hostname,

                    headers: {
                      Host: hostname,
                      Accept: "application/json",
                      "User-Agent": "Mozilla/5.0",
                    },
                  },
                  (res) => {
                    let body = "";

                    res.setEncoding("utf8");

                    res.on("data", (chunk) => {
                      body += chunk;
                    });

                    res.on("end", () => {
                      resolve({
                        statusCode: res.statusCode,
                        body,
                      });
                    });
                  }
                );

                req.setTimeout(10000, () => {
                  req.destroy(new Error("Request timeout"));
                });

                req.on("error", reject);
              });

              console.log("Status:", result.statusCode);
              console.log("Body length:", result.body.length);
              console.log("Body:", result.body.slice(0, 150));

              if (result.statusCode >= 200 && result.statusCode < 300) {
                console.log(`\n✅ IP FUNCIONAL: ${ip}`);
                break;
              }
            } catch (error) {
              console.log(`❌ ${ip}: ${error.message}`);
            }
          }
          EOF

      - name: Collect benefits
        run: npm start

      - name: Filter active benefits
        run: npm run filter-active

      - name: Generate HTML
        run: npm run build-html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4