name: Update and Deploy

on:
  schedule:
    - cron: "15 6 * * *"
      timezone: "America/Argentina/Buenos_Aires"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Santander every IPv4
        run: |
          set -e

          URL="https://www.santander.com.ar/bff-benefits/brands?categories=GAS&days=&exclusive=&pay_with=&location=caba&limit=12"
          HOST="www.santander.com.ar"

          IPS=$(getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u)

          echo "IPs encontradas:"
          echo "$IPS"

          for IP in $IPS; do
            echo ""
            echo "========================================"
            echo "Probando $IP"
            echo "========================================"

            if curl \
              --resolve "$HOST:443:$IP" \
              --http1.1 \
              --fail-with-body \
              --silent \
              --show-error \
              --max-time 10 \
              -H "Accept: application/json" \
              -H "User-Agent: Mozilla/5.0" \
              -o /tmp/santander.json \
              "$URL"
            then
              echo ""
              echo "✅ FUNCIONÓ: $IP"
              echo "Body:"
              head -c 200 /tmp/santander.json
              echo ""
              exit 0
            else
              echo "❌ FALLÓ: $IP"
            fi
          done

          echo ""
          echo "❌ Ningún IP de Santander respondió"
          exit 1

      - name: Collect benefits
        run: npm start

      - name: Filter active benefits
        run: npm run filter-active

      - name: Generate HTML
        run: npm run build-html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4